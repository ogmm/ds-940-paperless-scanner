services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - brokerdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paperless", "-d", "paperless"]
      interval: 15s
      timeout: 5s
      retries: 5

  paperless:
    image: "ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_VERSION:-3.4.2}"
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "${PAPERLESS_BIND_IP:-127.0.0.1}:${PAPERLESS_PORT:-8010}:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      PAPERLESS_SECRET_KEY: "${PAPERLESS_SECRET_KEY:?Set PAPERLESS_SECRET_KEY in .env}"
      PAPERLESS_TIME_ZONE: "${PAPERLESS_TIME_ZONE:-UTC}"
      PAPERLESS_OCR_LANGUAGE: "${PAPERLESS_OCR_LANGUAGE:-eng}"
      PAPERLESS_OCR_LANGUAGES: "${PAPERLESS_OCR_LANGUAGES:-}"
      PAPERLESS_CONSUMER_POLLING_INTERVAL: "15"
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
      USERMAP_UID: "${SCAN_UID:-1000}"
      USERMAP_GID: "${SCAN_GID:-1000}"
    volumes:
      - paperlessdata:/usr/src/paperless/data
      - paperlessmedia:/usr/src/paperless/media
      - type: bind
        source: "${SCAN_OUTPUT_DIR:-./consume}"
        target: /usr/src/paperless/consume
        bind:
          create_host_path: false
      - type: bind
        source: "${PAPERLESS_EXPORT_DIR:-./export}"
        target: /usr/src/paperless/export
        bind:
          create_host_path: false

volumes:
  brokerdata:
  pgdata:
  paperlessdata:
  paperlessmedia:
