<svg xmlns="http://www.w3.org/2000/svg" width="760" height="256" viewBox="0 0 760 256" role="img" aria-labelledby="title description">
  <title id="title">How the receiver delivers a duplex PDF</title>
  <desc id="description">The receiver captures front and back images and builds a single PDF in work/spool. It writes a temporary file and renames it to PDF in the destination. If delivery fails, it retries from the spool.</desc>

  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canvas { fill: #f5f7fb; stroke: #dbe2ed; }
    .card { fill: #fff; stroke: #d9e1ed; }
    .spool { fill: #e9f2ff; stroke: #b7d1f4; }
    .title { fill: #172439; font-size: 22px; font-weight: 650; }
    .detail { fill: #475972; font-size: 17px; }
    .path { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 17px; }
    .icon, .route, .retry { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon { stroke: #4d6788; stroke-width: 2.1; }
    .spool-icon, .route { stroke: #2e67bd; }
    .route, .retry { stroke-width: 2.4; }
    .arrow { fill: #2e67bd; }
    .retry { stroke: #587aa6; stroke-dasharray: 4 5; }
    .retry-arrow { fill: #587aa6; }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #151e2b; stroke: #37465a; }
      .card { fill: #1d293b; stroke: #3b4c62; }
      .spool { fill: #1b3152; stroke: #456a9b; }
      .title { fill: #f1f6fe; }
      .detail { fill: #b8c7db; }
      .icon { stroke: #a6bdda; }
      .spool-icon, .route { stroke: #8bb8ff; }
      .arrow { fill: #8bb8ff; }
      .retry { stroke: #a0b8d6; }
      .retry-arrow { fill: #a0b8d6; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow" d="M0 0 8 4 0 8Z"/>
    </marker>
    <marker id="retry-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="retry-arrow" d="M0 0 8 4 0 8Z"/>
    </marker>
  </defs>

  <rect class="canvas" x=".5" y=".5" width="759" height="255" rx="24"/>
  <path class="route" d="M232 97h39" marker-end="url(#arrow)"/>
  <path class="route" d="M489 97h39" marker-end="url(#arrow)"/>
  <path class="retry" d="M509 97v95a13 13 0 0 1-13 13H393a13 13 0 0 1-13-13v-12" marker-end="url(#retry-arrow)"/>
  <text class="detail" x="444" y="233" text-anchor="middle">Retry if delivery fails</text>

  <rect class="card" x="26" y="25" width="194" height="144" rx="17"/>
  <g class="icon" transform="translate(100 48)">
    <rect x="1" y="5" width="19" height="29" rx="3"/>
    <rect x="26" y="5" width="19" height="29" rx="3"/>
    <path d="M7 15h7m-7 6h7m18-6h7m-7 6h7"/>
  </g>
  <text class="title" x="123" y="115" text-anchor="middle">Scan both sides</text>
  <text class="detail" x="123" y="143" text-anchor="middle">Two page images</text>

  <rect class="spool" x="283" y="25" width="194" height="144" rx="17"/>
  <g class="icon spool-icon" transform="translate(362 46)">
    <path d="M2 5a4 4 0 0 1 4-4h18l10 10v26a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4Z"/>
    <path d="M24 1v8a2 2 0 0 0 2 2h8M10 20h16m-16 7h16m-16 7h10"/>
  </g>
  <text class="title" x="380" y="115" text-anchor="middle">Build one PDF</text>
  <text class="detail path" x="380" y="143" text-anchor="middle">work/spool</text>

  <rect class="card" x="540" y="25" width="194" height="144" rx="17"/>
  <g class="icon" transform="translate(616 48)">
    <path d="M2 10a4 4 0 0 1 4-4h10l5 5h15a4 4 0 0 1 4 4v17a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4Z"/>
    <path d="m15 23 4 4 8-8"/>
  </g>
  <text class="title" x="637" y="115" text-anchor="middle">Publish the PDF</text>
  <text class="detail" x="637" y="143" text-anchor="middle">Rename .part to .pdf</text>
</svg>
