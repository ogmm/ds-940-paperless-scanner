<svg xmlns="http://www.w3.org/2000/svg" width="760" height="276" viewBox="0 0 760 276" role="img" aria-labelledby="title description">
  <title id="title">Scanner network and PDF destinations</title>
  <desc id="description">The Brother DS-940DW connects by Wi-Fi on the same local network as a Synology NAS. The Docker receiver on the NAS saves PDFs to a chosen SMB share or a Paperless-ngx import folder.</desc>

  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canvas { fill: #f5f7fb; stroke: #dbe2ed; }
    .card { fill: #fff; stroke: #d9e1ed; }
    .receiver { fill: #e9f2ff; stroke: #b7d1f4; }
    .title { fill: #172439; font-size: 23px; font-weight: 650; }
    .destination { font-size: 21px; }
    .detail { fill: #475972; font-size: 17px; }
    .label { font-size: 17px; font-weight: 600; }
    .network { fill: #235bad; }
    .icon, .route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon { stroke: #4d6788; stroke-width: 2.1; }
    .receiver-icon, .route { stroke: #2e67bd; }
    .route { stroke-width: 2.4; }
    .arrow { fill: #2e67bd; }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #151e2b; stroke: #37465a; }
      .card { fill: #1d293b; stroke: #3b4c62; }
      .receiver { fill: #1b3152; stroke: #456a9b; }
      .title { fill: #f1f6fe; }
      .detail { fill: #b8c7db; }
      .network { fill: #a8ccff; }
      .icon { stroke: #a6bdda; }
      .receiver-icon, .route { stroke: #8bb8ff; }
      .arrow { fill: #8bb8ff; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow" d="M0 0 8 4 0 8Z"/>
    </marker>
  </defs>

  <rect class="canvas" x=".5" y=".5" width="759" height="275" rx="24"/>
  <text class="detail label" x="26" y="43">Same local network</text>
  <text class="detail label" x="526" y="43">Choose a destination</text>

  <rect class="card" x="26" y="69" width="174" height="180" rx="17"/>
  <g class="icon" transform="translate(92 101)">
    <path d="M13 1h20a4 4 0 0 1 4 4v26"/>
    <rect x="3" y="8" width="27" height="35" rx="4"/>
    <path d="M10 20h13m-13 7h13m-13 7h8"/>
  </g>
  <text class="detail" x="113" y="179" text-anchor="middle">Brother</text>
  <text class="title" x="113" y="211" text-anchor="middle">DS-940DW</text>

  <text class="network label" x="239" y="141" text-anchor="middle">Wi-Fi</text>
  <path class="route" d="M211 159h55" marker-end="url(#arrow)"/>

  <rect class="receiver" x="278" y="69" width="174" height="180" rx="17"/>
  <g class="icon receiver-icon" transform="translate(344 104)">
    <rect x="1" y="1" width="40" height="15" rx="4"/>
    <rect x="1" y="23" width="40" height="15" rx="4"/>
    <path d="M9 8.5h1m8 0h15M9 30.5h1m8 0h15"/>
  </g>
  <text class="title" x="365" y="182" text-anchor="middle">Synology NAS</text>
  <text class="detail" x="365" y="211" text-anchor="middle">Docker receiver</text>

  <path class="route" d="M464 159h28"/>
  <path class="route" d="M492 159v-41a10 10 0 0 1 10-10h13" marker-end="url(#arrow)"/>
  <path class="route" d="M492 159v41a10 10 0 0 0 10 10h13" marker-end="url(#arrow)"/>

  <rect class="card" x="526" y="69" width="208" height="78" rx="17"/>
  <path class="icon" transform="translate(543 95)" d="M1 6a4 4 0 0 1 4-4h6l5 5h10a4 4 0 0 1 4 4v11a4 4 0 0 1-4 4H5a4 4 0 0 1-4-4Z"/>
  <text class="title destination" x="587" y="103">SMB share</text>
  <text class="detail" x="587" y="128">PDF files</text>

  <rect class="card" x="526" y="171" width="208" height="78" rx="17"/>
  <g class="icon" transform="translate(545 196)">
    <path d="M12 27H5a4 4 0 0 1-4-4V5a4 4 0 0 1 4-4h12l6 6v4M6 8h6m-6 6h5"/>
    <circle cx="20" cy="19" r="6"/>
    <path d="m24.3 23.3 5 5"/>
  </g>
  <text class="title destination" x="587" y="205">Paperless-ngx</text>
  <text class="detail" x="587" y="230">OCR and search</text>
</svg>
