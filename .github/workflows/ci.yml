name: Verify scanner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Test the receiver
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
      - name: Validate the Compose examples
        run: |
          export SCANNER_IP=192.0.2.42
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export PAPERLESS_SECRET_KEY="$(openssl rand -hex 32)"
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.paperless.yaml config --quiet
      - name: Build the local scanner image
        run: docker build --platform linux/amd64 -t ds-940-paperless-scanner:ci .
      - name: Start the image without a scanner
        run: |
          # Same hardening as compose.yaml. 192.0.2.42 is a documentation address,
          # so a working receiver loads the driver and settles in scanner_offline.
          docker run -d --name ds940-smoke --user 1000:1000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 512m \
            --tmpfs /tmp:size=32m,mode=1777 --tmpfs /work:mode=1777 --tmpfs /consume:mode=1777 \
            -e SCANNER_IP=192.0.2.42 ds-940-paperless-scanner:ci
          state=""
          for attempt in $(seq 1 60); do
            state="$(docker exec ds940-smoke python -c 'import json; print(json.load(open("/work/auto-status.json"))["state"])' 2>/dev/null || true)"
            [ "$state" = scanner_offline ] && break
            sleep 2
          done
          docker logs ds940-smoke
          echo "Receiver state: ${state:-none}"
          test "$state" = scanner_offline
          docker exec ds940-smoke python -m ds940.supervisor healthcheck
          docker stop --time 15 ds940-smoke
